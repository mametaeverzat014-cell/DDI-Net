# Render blueprint for the DDI-Net research inference API.
#
# plan: starter ($7/mo) rather than free, deliberately. A free Render service
# spins down after 15 minutes idle and takes about a minute to wake, and a judge
# opening the Analyze page would meet a dead endpoint. The lean image needs
# ~158 MiB, so it fits either plan; the $7 buys always-on, not memory.
#
# Switch `plan` to `free` for a demo you will warm up by hand.
services:
  - type: web
    name: ddinet-api
    runtime: docker
    dockerfilePath: ./serving/Dockerfile.lean
    dockerContext: .
    plan: starter
    region: frankfurt
    # 200 only when the frozen model AND the evidence layer are loaded.
    healthCheckPath: /api/health/ready
    autoDeploy: false
    envVars:
      - key: DDINET_ENGINE
        value: lean
      - key: DDINET_EXTERNAL_SOURCES
        value: "on"
      # Render's proxy appends the client address to X-Forwarded-For; the
      # rate limiter keys on that right-most entry (serving/ratelimit.py).
      - key: DDINET_PROXY_HOPS
        value: "1"
      # Optional but recommended: free key from open.fda.gov. Entered in the
      # dashboard, never committed (sync: false = prompt, not stored here).
      - key: OPENFDA_API_KEY
        sync: false
